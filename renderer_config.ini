[General]
; 0 = Simple Scaler, 1 = Anime4K Pipeline
Mode=1
VerboseLogging=true

[Filters]
; Pre-processing filters
EdgeSmoothing=true
SmoothingStrength=0.6
HDR=true
HDRSaturation=1.2
HDRContrast=1.1
BlackCrushThreshold=0.03
BlackCrushStrength=1.0

[Scaler]
; Anime4K Version (0=UL, 1=U, 2=M, 3=L, 4=H)
Anime4KVersion=0
Sharpness=0.5

[PostProcessing]
; Post-processing filters (applied after scaling)
Sharpen=false
Denoise=false
