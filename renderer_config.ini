[General]
; Render mode:
; 0 = Simple Scaler (basic bilinear)
; 1 = Anime4K Pipeline (multi-pass shader upscaling)
; 2 = libplacebo (high-quality upscaling with HDR support, requires Vulkan)
Mode=2
VerboseLogging=true

; Backend selection: auto, vulkan, opengl, libplacebo
; auto = Use Vulkan if HDR is enabled on the display, otherwise OpenGL
; vulkan = Force Vulkan backend (supports HDR output)
; opengl = Force OpenGL backend (no HDR support)
; libplacebo = Use libplacebo with Vulkan (best quality, requires libplacebo)
Backend=libplacebo


[libplacebo]
; Upscaling algorithm:
; bilinear, bicubic, hermite, lanczos, ewa_lanczos, ewa_lanczossharp,
; spline16, spline36, spline64, mitchell, catmull_rom, robidoux,
; robidouxsharp, gaussian, oversample
;
; Recommended:
; - ewa_lanczos: High quality (default)
; - oversample: Best for pixel art (preserves sharp pixels)
; - spline36: Good balance of sharpness and smoothness
; - mitchell: Balanced, minimal ringing
Upscaler=oversample
Downscaler=lanczos

; Anti-ringing strength (0.0 - 1.0)
; Reduces ringing artifacts from sharp filters
Antiringing=0.5

; Sigmoidization for better upscaling quality
Sigmoidize=true

; Debanding - removes color banding artifacts
Debanding=true
DebandIterations=1
DebandThreshold=3.0
DebandRadius=16.0
DebandGrain=4.0

; Color adjustments
Brightness=0.0
Contrast=1.1
Saturation=1.2
Gamma=1.0
Hue=0.0

; Color mode:
; passthrough = No color processing
; sdr_enhance = Enhanced SDR (applies color adjustments)
; hdr10 = HDR10 output (requires HDR display)
; hdr10_tonemap = HDR with tonemapping
ColorMode=sdr_enhance

; HDR settings (only used when ColorMode=hdr10)
PeakNits=1000
PaperWhiteNits=203
HDRPassthrough=false

; Dithering - reduces color banding at output
Dithering=true
DitherDepth=8

; Performance options
SkipAntiAliasing=false
PreserveMixingCache=true

; Custom Shader Support (Anime4K via libplacebo)
; Enable loading of custom shaders (mpv .glsl format)
EnableCustomShaders=true

; Anime4K Preset (only used when EnableCustomShaders=true)
; none       = No Anime4K shaders
; mode_a     = Fast - Restore + Upscale (recommended for most content)
; mode_b     = Fast - Upscale + Denoise
; mode_c     = Fast - Upscale (sharpest)
; mode_a_hq  = HQ - Restore + Upscale (best quality, slower)
; mode_b_hq  = HQ - Upscale + Denoise
; mode_c_hq  = HQ - Upscale (maximum sharpness)
;
; Each preset configures an optimized shader chain from Anime4K
Anime4KPreset=mode_a

; Directory containing shader files (relative to game directory or absolute)
ShaderDirectory=data/shaders

; Additional custom shaders (semicolon-separated paths)
; These are loaded AFTER the Anime4K preset
; Example: CustomShaders=shaders/my_filter.glsl;shaders/post.glsl
CustomShaders=


[Anime4K]
EnablePrePass=false
PrePassShader=

EnableClean1=true
Clean1Shader=Anime4K_Clamp_Highlights.glsl

EnableClean2=true
Clean2Shader=Anime4K_Restore_CNN_M.glsl

EnableScale1=true
Scale1Shader=Anime4K_Upscale_CNN_x2_L.glsl

EnableOptimize=true
OptimizeShader=Anime4K_AutoDownscalePre_x4.glsl

EnableScale2=true
Scale2Shader=Anime4K_Upscale_CNN_x2_M.glsl

EnablePolish=true
PolishShader=Anime4K_Thin_HQ.glsl

EnablePostPass=false
PostPassShader=
