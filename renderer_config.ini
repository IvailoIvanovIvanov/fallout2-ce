[General]
; Render mode:
; 0 = Simple (basic SDL rendering, no upscaling)
; 1 = libplacebo (high-quality upscaling with HDR support, requires Vulkan)
Mode=1
VerboseLogging=true


[libplacebo]
; =============================================================================
; UPSCALING CONFIGURATION
; =============================================================================

; Upscaling algorithm:
; bilinear, bicubic, hermite, lanczos, ewa_lanczos, ewa_lanczossharp,
; ewa_lanczos4sharpest, spline16, spline36, spline64, mitchell, 
; catmull_rom, robidoux, robidouxsharp, gaussian, oversample
;
; Recommended:
; - ewa_lanczos4sharpest: Best quality for most content
; - ewa_lanczos: High quality (good default)
; - oversample: Best for pixel art (preserves sharp pixels)
; - spline36: Good balance of sharpness and smoothness
Upscaler=ewa_lanczos4sharpest
Downscaler=lanczos

; Anti-ringing strength (0.0 - 1.0)
; Reduces "halo" artifacts from sharp filters like lanczos
Antiringing=0.8

; Sigmoidization for better upscaling quality
; Reduces banding and improves gradients during upscale
Sigmoidize=true

; =============================================================================
; DEBANDING (removes color banding artifacts from 8-bit art)
; =============================================================================

Debanding=true
DebandIterations=2
DebandThreshold=4.0
DebandRadius=32.0
DebandGrain=6.0

; =============================================================================
; COLOR ADJUSTMENTS
; =============================================================================

Brightness=0.0
Contrast=1.1
Saturation=1.2
Gamma=1.0
Hue=0.0

; Color mode:
; passthrough   = No color processing
; sdr_enhance   = Enhanced SDR (applies color adjustments above)
; hdr10         = HDR10 output (requires HDR display)
; hdr10_tonemap = HDR with tonemapping
ColorMode=sdr_enhance

; =============================================================================
; HDR SETTINGS (only used when ColorMode=hdr10 or hdr10_tonemap)
; =============================================================================

PeakNits=1000
PaperWhiteNits=203
HDRPassthrough=false

; =============================================================================
; DITHERING (reduces color banding at output)
; =============================================================================

Dithering=true
DitherDepth=10

; =============================================================================
; PERFORMANCE OPTIONS
; =============================================================================

SkipAntiAliasing=false
PreserveMixingCache=true

; =============================================================================
; CUSTOM SHADERS (Anime4K via libplacebo)
; =============================================================================

; Enable loading of custom shaders (mpv .glsl format)
EnableCustomShaders=true

; Anime4K Preset (only used when EnableCustomShaders=true)
; none       = No Anime4K shaders (use only libplacebo upscaler)
; mode_a     = Fast - Restore + Upscale (recommended for most content)
; mode_b     = Fast - Upscale + Denoise
; mode_c     = Fast - Upscale (sharpest)
; mode_a_hq  = HQ - Restore + Upscale (best quality, slower)
; mode_b_hq  = HQ - Upscale + Denoise
; mode_c_hq  = HQ - Ultra Quality (maximum sharpness and restoration)
Anime4KPreset=mode_c_hq

; Directory containing shader files (relative to game directory or absolute)
ShaderDirectory=data/shaders

; Additional custom shaders (semicolon-separated paths)
; These are loaded AFTER the Anime4K preset
; Example: CustomShaders=Anime4K_Upscale_GAN_x4_UUL.glsl
CustomShaders=
