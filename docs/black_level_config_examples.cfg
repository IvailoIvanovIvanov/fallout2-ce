# Enhanced Black Levels Configuration Examples
# Add these settings to your fallout2-ce.cfg file under the [system] section

# ============================================================================
# RECOMMENDED: Balanced (Good for most displays)
# ============================================================================
[system]
upscaler_hdr_enable=1
upscaler_hdr_strength=0.5
upscaler_hdr_saturation=1.2
upscaler_hdr_contrast=1.1
upscaler_black_crush_threshold=0.03
upscaler_black_crush_strength=1.0

# ============================================================================
# OLED Optimized: Deep Pure Blacks
# Perfect for OLED TVs and monitors where you want absolute blacks
# ============================================================================
#[system]
#upscaler_hdr_enable=1
#upscaler_hdr_strength=0.6
#upscaler_hdr_saturation=1.3
#upscaler_hdr_contrast=1.2
#upscaler_black_crush_threshold=0.04
#upscaler_black_crush_strength=1.5

# ============================================================================
# LCD Vivid: Bright Colors, Moderate Blacks
# For LCD displays with good contrast ratio
# ============================================================================
#[system]
#upscaler_hdr_enable=1
#upscaler_hdr_strength=0.7
#upscaler_hdr_saturation=1.4
#upscaler_hdr_contrast=1.3
#upscaler_black_crush_threshold=0.025
#upscaler_black_crush_strength=0.8

# ============================================================================
# Cinema Mode: Maximum Shadow Detail
# For atmospheric scenes where you want to see into shadows
# ============================================================================
#[system]
#upscaler_hdr_enable=1
#upscaler_hdr_strength=0.4
#upscaler_hdr_saturation=1.1
#upscaler_hdr_contrast=1.0
#upscaler_black_crush_threshold=0.015
#upscaler_black_crush_strength=0.5

# ============================================================================
# Retro CRT: Preserve Original Look
# Minimal processing, closer to original appearance
# ============================================================================
#[system]
#upscaler_hdr_enable=1
#upscaler_hdr_strength=0.3
#upscaler_hdr_saturation=1.0
#upscaler_hdr_contrast=1.0
#upscaler_black_crush_threshold=0.02
#upscaler_black_crush_strength=0.7

# ============================================================================
# HDR Display: Maximum Dynamic Range
# For true HDR monitors with high brightness and deep blacks
# ============================================================================
#[system]
#upscaler_hdr_enable=1
#upscaler_hdr_strength=0.8
#upscaler_hdr_saturation=1.4
#upscaler_hdr_contrast=1.4
#upscaler_black_crush_threshold=0.05
#upscaler_black_crush_strength=1.8

# ============================================================================
# Parameter Reference
# ============================================================================
# upscaler_hdr_enable: 0 or 1 (enable HDR filter)
# upscaler_hdr_strength: 0.0-1.0 (overall effect intensity)
# upscaler_hdr_saturation: 0.0-2.0 (color vividness, 1.0 = neutral)
# upscaler_hdr_contrast: 0.0-2.0 (contrast enhancement, 1.0 = neutral)
# upscaler_black_crush_threshold: 0.0-0.15 (luminance to crush to black)
# upscaler_black_crush_strength: 0.0-2.0 (near-black darkening, 1.0 = natural)

# ============================================================================
# Quick Troubleshooting
# ============================================================================
# Blacks look gray → Increase black_crush_threshold and/or black_crush_strength
# Lost shadow detail → Decrease black_crush_threshold
# Colors not vivid → Increase hdr_saturation and/or hdr_contrast
# Too much contrast → Decrease hdr_contrast
# Banding in darks → Enable debanding: upscaler_enable_debanding=1
